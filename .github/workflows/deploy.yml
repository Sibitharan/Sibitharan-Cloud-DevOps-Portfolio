name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to S3 and CloudFront
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 3. Upload portfolio to S3
      - name: Deploy portfolio to S3
        run: |
          aws s3 sync . s3://sibitharan-cloud-devops-portfolio \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      # 4. Clear CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3KWR2VUQHRJGV \
            --paths "/*"
